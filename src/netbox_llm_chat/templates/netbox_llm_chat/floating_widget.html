{% load static %}
<div class="netbox-llm-chat-widget">
<link rel="stylesheet" href="{% static 'netbox_llm_chat/floating.css' %}?v=21">
<button type="button" class="netbox-llm-chat-fab" aria-label="Ouvrir NetBox LLM Chat" title="NetBox LLM Chat">
  <span aria-hidden="true">✦</span>
</button>
<section class="netbox-llm-chat-drawer" hidden aria-label="NetBox LLM Chat">
  <header class="netbox-llm-chat-drawer-header" data-netbox-llm-chat-drag-handle>
    <strong>NetBox LLM Chat</strong>
    <span class="netbox-llm-chat-drawer-status netbox-llm-chat-status">RW · pynetbox…</span>
    <div class="netbox-llm-chat-actions" aria-label="Actions de fenêtre">
      <button type="button" class="netbox-llm-chat-clear" title="Nouvelle session" aria-label="Nouvelle session">↺</button>
      <button type="button" class="netbox-llm-chat-dock" title="Ancrer à droite" aria-label="Ancrer à droite">▥</button>
      <button type="button" class="netbox-llm-chat-close" title="Fermer" aria-label="Fermer">−</button>
    </div>
  </header>

  <div class="netbox-llm-chat-tabsbar">
    <div class="netbox-llm-chat-tabs" aria-label="Sessions"></div>
    <button type="button" class="netbox-llm-chat-tab-add" title="Nouvelle session" aria-label="Nouvelle session">+</button>
  </div>

  <div class="netbox-llm-chat-drawer-messages">
    <div class="netbox-llm-chat-intro">Assistant NetBox. Lecture/écriture selon la configuration globale. Les écritures demandent une confirmation.</div>
  </div>

  <form class="netbox-llm-chat-drawer-form">
    {% csrf_token %}
    <input class="netbox-llm-chat-drawer-input" autocomplete="off" maxlength="12000" placeholder="Interroger NetBox…" aria-label="Question">
    <button type="submit" aria-label="Envoyer">➤</button>
  </form>

  <footer class="netbox-llm-chat-drawer-footer" aria-label="Informations du plugin">
    <span class="netbox-llm-chat-version">v{{ plugin_version }}</span>
  </footer>

  <div class="netbox-llm-chat-resize-handle netbox-llm-chat-resize-handle-tl" title="Redimensionner" aria-hidden="true"></div>
</section>
<script src="{% static 'netbox_llm_chat/floating.js' %}?v=34"></script>
</div>
