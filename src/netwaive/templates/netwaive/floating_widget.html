{% load static %}
<div class="netwaive-widget">
<link rel="stylesheet" href="{% static 'netwaive/floating.css' %}?v=21">
<button type="button" class="netwaive-fab" aria-label="Ouvrir NetWAIve" title="NetWAIve">
  <span aria-hidden="true">✦</span>
</button>
<section class="netwaive-drawer" hidden aria-label="NetWAIve">
  <header class="netwaive-drawer-header" data-netwaive-drag-handle>
    <strong>{{ widget_title }}</strong>
    <span class="netwaive-drawer-status netwaive-status">RW · pynetbox…</span>
    <div class="netwaive-actions" aria-label="Actions de fenêtre">
      <button type="button" class="netwaive-clear" title="Nouvelle session" aria-label="Nouvelle session">↺</button>
      <button type="button" class="netwaive-dock" title="Ancrer à droite" aria-label="Ancrer à droite">▥</button>
      <button type="button" class="netwaive-close" title="Fermer" aria-label="Fermer">−</button>
    </div>
  </header>

  <div class="netwaive-tabsbar">
    <div class="netwaive-tabs" aria-label="Sessions"></div>
    <button type="button" class="netwaive-tab-add" title="Nouvelle session" aria-label="Nouvelle session">+</button>
  </div>

  <div class="netwaive-drawer-messages">
    <div class="netwaive-intro" data-netwaive-banner="{{ banner }}">{{ banner }}</div>
  </div>

  <form class="netwaive-drawer-form">
    {% csrf_token %}
    <input class="netwaive-drawer-input" autocomplete="off" maxlength="12000" placeholder="Interroger NetBox…" aria-label="Question">
    <button type="submit" aria-label="Envoyer">➤</button>
  </form>

  <footer class="netwaive-drawer-footer" aria-label="Informations du plugin">
    <span class="netwaive-version">v{{ plugin_version }}</span>
  </footer>

  <div class="netwaive-resize-handle netwaive-resize-handle-tl" title="Redimensionner" aria-hidden="true"></div>
</section>
<script src="{% static 'netwaive/floating.js' %}?v=38"></script>
</div>
